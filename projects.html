    <style>
        body {
            margin: 0;
        }

        .projects-container {
            width: 100%;
            max-width: 1500px;
            margin: 0 auto;
            padding: 30px 25px;
        }

        .projects-title {
            text-align: center;
            margin: 35px 0;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 45px;
            justify-items: center;
        }

        .project {
            width: 100%;
            max-width: 650px;
            text-align: center;
        }

        .project-box {
            width: 100%;
            height: 450px;
            border: 3px solid #333;
            border-radius: 12px;
            margin: 0 auto;
            background-color: black;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .project-box:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }

        .project-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .project-box iframe {
            width: 100%;
            height: 100%;
            display: block;
            border: none;
        }

        .project-caption {
            font-size: 18px;
            margin: 18px auto 30px;
            line-height: 1.6;
        }

        @media (max-width: 900px) {
            .projects-grid {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .project {
                max-width: 700px;
            }

            .project-box {
                height: 420px;
            }
        }

        @media (max-width: 500px) {
            .projects-container {
                padding: 15px;
            }

            .project-box {
                height: 350px;
            }

            .project-caption {
                font-size: 16px;
            }
        }
    </style>
</head>
